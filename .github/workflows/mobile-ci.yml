name: Mobile CI (fibemate-mobile / Expo)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-type-test:
    name: Lint + Type-check + Test (Expo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Node >= 22 is required: test/securestore.node.cjs requires src/services/shardStore.ts
          # directly, which relies on the built-in TypeScript type stripping (unflagged in 22.18).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo SDK alignment (npx expo install --check — advisory)
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          if npx expo install --check; then
            echo "Expo SDK-managed dependencies are aligned with the SDK 57 matrix."
          else
            echo "::warning title=Expo SDK alignment drift::npx expo install --check reports SDK-managed dependencies that need updating. Advisory only: Dependabot is configured to leave these to the SDK line (.github/dependabot.yml); this step no longer blocks the required check."
          fi

      - name: Lint (eslint . — hard gate)
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Expo doctor (advisory, non-blocking)
        continue-on-error: true
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo-doctor

      # Real gate. Replaces `npx jest --passWithNoTests`, which ran nothing: this repo has no
      # jest config/dependency, and the tests are node:test files named *.node.cjs precisely so
      # that jest's default testMatch never sees them.
      - name: Unit tests (node:test — shard store + entropy)
        run: npm test

      - name: Advisory - PQC dependency alignment (non-blocking)
        if: always()
        shell: bash
        run: |
          node -e '
            const p = require("./package.json");
            const v = (p.dependencies && p.dependencies["@noble/curves"]) || (p.devDependencies && p.devDependencies["@noble/curves"]) || "absent";
            const CANON = "2.2.0";
            console.log("[@noble/curves] repo version:", v, "| backend canonical:", CANON);
            if (v !== CANON) {
              console.log("ADVISORY: @noble/curves drifts from backend canonical " + CANON + ". Align when convenient (P2).");
            } else {
              console.log("OK: aligned with backend canonical.");
            }
          '

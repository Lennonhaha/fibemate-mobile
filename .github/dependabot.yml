# ============================================================
# NEW FILE: Lennonhaha/fibemate-mobile  .github/dependabot.yml
# ============================================================
# 该仓库此前【无】dependabot.yml（Dependabot 用隐式默认：每次 bump = 1 PR，
# 无 groups / 无 ignore / 无 labels）——这就是此前 PR #12 / #14 死锁的根因。
# 本文件为其首次引入，配套 .github/workflows/dependabot-auto-merge.yml。
#
# 关键点：image-size 在 package-lock.json 中由 metro 引入（1.2.1），
# 漏洞区间 <= 2.0.2【无上游补丁】，故以 ignore 标注。
# 注意：用 YAML 注释记录理由（Dependabot schema 不支持 `reason:` 字段）；
# 该 ignore 是"已知漏洞的显式压制"，必须在 dossier §7 + security-limitations 中记录，
# 不得静默绕过（详见 workspace 草稿 dependabot-auto-merge-drafts_20260912.md）。
#
# --- 2026-10-14 (P2): Expo SDK-managed deps are ignored here -------------
# Root cause of the #25 / #32 / #53 dependency churn: Dependabot has no
# knowledge of the Expo SDK 57 version matrix, so it kept bumping packages
# OFF-matrix (expo-crypto 57.0.4 -> 58.0.5, react 19.2.3 -> 19.3.0,
# react-dom -> 19.3.0, react-native 0.86.3 -> 0.87.1, react-native-web
# 0.21.3 -> 0.21.4). Every one of those re-conflicted the dependency PRs
# and left main off-matrix (see PR #57).
# The SDK matrix is owned by `npx expo install`; those packages are ignored
# here and enforced in CI by `npx expo install --check`
# (see .github/workflows/mobile-ci.yml).
# ============================================================

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - "dependencies"
      - "automerge"
    ignore:
      # ---- Expo SDK-managed packages (versioned by `npx expo install`) ----
      # Dependabot cannot know the SDK matrix; any bump it opens for these
      # drifts off-matrix. Leave them to `npx expo install --fix` and the
      # CI gate `npx expo install --check`.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@types/react"
      # image-size: 1.2.1 pinned in package-lock.json (pulled by metro,
      # node_modules/metro -> image-size@^1.0.2). Vulnerable range is
      # <= 2.0.2 with NO upstream fix as of 2026-09 (ICNS/JXL/HEIF parsers).
      # No safe pin exists (every version <= 2.0.2 is affected). Tracked via
      # GHSA; ignore the major bump and revisit when upstream patches land.
      # This is a deliberate suppress — documented in dossier §7 + security-limitations.
      - dependency-name: "image-size"
        update-types: ["version-update:semver-major"]
      # eslint 8 -> 10: major breaking (flat config migration required).
      # Closed PR #27. Revisit when .eslintrc.js is migrated to eslint.config.js.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript 6 -> 7: major breaking. Closed PR #28.
      # Revisit after upgrading expo/tsconfig.base compatibility.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Remaining non-SDK runtime deps that are still safe to bump on their
      # own cadence (expo/react-native/* are ignored above).
      runtime-deps:
        applies-to: version-updates
        patterns:
          - "@react-navigation/*"
          - "@noble/curves"
          - "sm-crypto"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "prettier*"
          - "typescript"
        update-types:
          - "minor"
          - "patch"

  # ----------------------------------------------------------------------
  # GitHub Actions are pinned to full commit SHAs in .github/workflows/*
  # (see the codeql / dco / interop / mobile-ci workflows). Without this
  # entry Dependabot never proposes a bump for them, so the pins silently
  # age. This entry makes the pinned SHAs trackable again: Dependabot opens
  # a PR when the referenced tag moves, and the pin comment tells the
  # reviewer which release the new SHA corresponds to.
  #
  # Deliberately NOT labelled `automerge`: unlike the npm bumps below, a
  # moved action SHA changes what runs in CI, so these PRs wait for human
  # review instead of being auto-merged by dependabot-auto-merge.yml.
  # ----------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
